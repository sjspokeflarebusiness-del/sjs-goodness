<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Shop — SJS Goodness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-container">
  <h1 class="form-title">Register Your Shop</h1>
  <p class="form-subtitle">Join the Puducherry marketplace.</p>
  <div id="error" class="form-error" style="display:none;"></div>

  <form id="register-form">
    <div class="form-group"><label>Shop Name</label><input id="name" class="form-input" required></div>
    <div class="form-group"><label>Category</label><input id="category" class="form-input" placeholder="e.g. Groceries"></div>
    <div class="form-group"><label>Description</label><input id="description" class="form-input"></div>
    <div class="form-group"><label>Phone</label><input id="phone" class="form-input" required></div>
    <div class="form-group"><label>Email</label><input type="email" id="email" class="form-input" required></div>
    <div class="form-group"><label>Password (min 6)</label><input type="password" id="password" class="form-input" minlength="6" required></div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>

  <p class="form-footer">Already registered? <a href="login.html">Sign in</a></p>
</div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value.trim(),
    category: document.getElementById('category').value.trim(),
    description: document.getElementById('description').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  };
  const result = Auth.register(data);
  if (result.error) {
    const err = document.getElementById('error');
    err.textContent = result.error;
    err.style.display = 'block';
    return;
  }
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
