<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/head-loader.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Control Center — SJS Goodness</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar">
    <div class="brand" style="padding:0.5rem 0;">
      <div class="brand-logo" style="background:linear-gradient(135deg,#dc2626,#b91c1c);">F</div>
      <div>
        <div class="brand-name" style="font-size:0.9rem;">Flaren</div>
        <div class="brand-sub">Admin</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="admin-nav"></nav>
  </aside>
  <div class="dash-main">
    <header class="dash-header">
      <div>
        <h1 style="font-size:1.15rem;">Command Center</h1>
        <p class="text-xs text-muted">Platform Administration</p>
      </div>
      <div style="display:flex;gap:0.75rem;align-items:center;">
        <div id="notif-container"></div>
        <span class="admin-badge">ADMIN</span>
      </div>
    </header>
    <main class="dash-content" id="content"></main>
  </div>
</div>

<button class="admin-quick-delete" onclick="openQuickDelete()">🗑️ Quick Delete</button>
<div id="modal-root"></div>

  <script src="js/tail-loader.js"></script>
</body>
</html>
