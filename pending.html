<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Approval — SJS Goodness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-container" style="text-align:center;">
  <div style="font-size:5rem;margin-bottom:1rem;">⏳</div>
  <h1 class="form-title">Pending Approval</h1>
  <p class="form-subtitle" id="shop-name-pending"></p>
  <div class="form-warning" style="text-align:left;">
    Your shop is waiting for admin approval. Please contact us:
    <br><br>
    <strong>WhatsApp: 8056669214</strong>
    <br><br>
    Once approved, you'll be able to log in and manage your shop.
  </div>
  <a href="https://wa.me/918056669214?text=Hi, I'm waiting for shop approval" target="_blank" class="btn btn-success btn-block mt-4">📱 WhatsApp Now</a>
  <button onclick="Auth.logout()" class="btn btn-ghost btn-block mt-2">Logout</button>
</div>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
const s = Auth.currentShop();
if (s) document.getElementById('shop-name-pending').innerHTML = '<strong>' + esc(s.name) + '</strong> is waiting for approval.';
else window.location.href = 'login.html';
</script>
</body>
</html>
