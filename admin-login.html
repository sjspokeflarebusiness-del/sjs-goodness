<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SJS Goodness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-container">
  <h1 class="form-title">🔐 Admin Login</h1>
  <p class="form-subtitle">Restricted access — SJS Goodness platform admins only.</p>
  <div id="error" class="form-error" style="display:none;"></div>
  <form id="admin-form">
    <div class="form-group"><label>Username</label><input id="username" class="form-input" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" class="form-input" required></div>
    <button class="btn btn-danger btn-block">Sign In as Admin</button>
  </form>
  <p class="form-footer"><a href="login.html" style="color:#999;">← Owner Login</a></p>
</div>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('admin-form').addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (Auth.adminLogin(u, p)) window.location.href = 'admin.html';
  else {
    const err = document.getElementById('error');
    err.textContent = 'Invalid admin credentials.';
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
