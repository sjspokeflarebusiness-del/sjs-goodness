<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/head-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJS Goodness — Puducherry Marketplace</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <div class="brand-logo">S</div>
      <div>
        <div class="brand-name">SJS Goodness</div>
        <div class="brand-sub">Puducherry Marketplace</div>
      </div>
    </a>
    <nav class="nav">
      <a href="index.html" class="active">Shops</a>
      <a href="login.html" class="btn btn-primary btn-sm">Owner Login</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>Discover Local Shops in Puducherry</h1>
    <p>Buy directly from local sellers. Fresh products, honest prices.</p>
    <div class="search-bar-wrap">
      <input type="text" id="search" class="search-input" placeholder="Search shops or categories...">
    </div>
  </div>
</section>

<main class="container main">
  <h2 id="shops-title" class="section-title">Shops</h2>
  <div id="shops-grid" class="shops-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none;">
    <p>No shops found.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">© SJS Goodness · Puducherry</div>
</footer>

<script src="js/tail-loader.js"></script>
</body>
</html>
