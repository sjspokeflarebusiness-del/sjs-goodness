<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJS Goodness — Puducherry Local Marketplace</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ============================================
// STORAGE LAYER (localStorage as database)
// ============================================
const DB = {
  get(key, fallback) {
    try { const v = localStorage.getItem('sjs_' + key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, value) { localStorage.setItem('sjs_' + key, JSON.stringify(value)); },

  // Shops
  getShops: () => DB.get('shops', []),
  saveShops: (s) => DB.set('shops', s),

  // Products
  getProducts: () => DB.get('products', []),
  saveProducts: (p) => DB.set('products', p),

  // Orders
  getOrders: () => DB.get('orders', []),
  saveOrders: (o) => DB.set('orders', o),

  // Expenses
  getExpenses: () => DB.get('expenses', []),
  saveExpenses: (e) => DB.set('expenses', e),

  // Customers
  getCustomers: () => DB.get('customers', []),
  saveCustomers: (c) => DB.set('customers', c),

  // Session
  getSession: () => DB.get('session', null),
  setSession: (s) => DB.set('session', s),
  clearSession: () => localStorage.removeItem('sjs_session'),

  // Seed demo data on first load
  seed() {
    if (DB.getShops().length === 0) {
      const demoShop = {
        id: 'shop_sjs',
        ownerEmail: 'mom@sjs.com',
        ownerPassword: 'sjs12345',
        name: 'SJS Goodness',
        description: 'Country sugar, natural seeds and traditional goodness from Puducherry.',
        category: 'Groceries',
        serviceArea: 'Puducherry',
        phone: '+91 90000 00000',
        logo: 'https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=200',
        isApproved: true,
        createdAt: new Date().toISOString()
      };
      DB.saveShops([demoShop]);

      DB.saveProducts([
        { id: 'p1', shopId: 'shop_sjs', name: 'Country Sugar (Nattu Sakkarai)', description: 'Pure traditional country sugar', price: 120, cost: 80, stock: 50, unit: 'kg', category: 'Sugar', image: 'https://images.unsplash.com/photo-1581447100594-7e3d0f5c1b8b?w=400', isAvailable: true, isPublished: true, lowStockAt: 10, createdAt: new Date().toISOString() },
        { id: 'p2', shopId: 'shop_sjs', name: 'Pumpkin Seeds', description: 'Premium raw pumpkin seeds', price: 250, cost: 180, stock: 30, unit: 'kg', category: 'Seeds', image: 'https://images.unsplash.com/photo-1599909631950-9f4f0d0b9e6b?w=400', isAvailable: true, isPublished: true, lowStockAt: 5, createdAt: new Date().toISOString() },
        { id: 'p3', shopId: 'shop_sjs', name: 'Sunflower Seeds', description: 'Fresh sunflower seeds', price: 200, cost: 140, stock: 3, unit: 'kg', category: 'Seeds', image: 'https://images.unsplash.com/photo-1596591606975-97ee5cef3a1e?w=400', isAvailable: true, isPublished: true, lowStockAt: 5, createdAt: new Date().toISOString() }
      ]);
    }
  }
};

DB.seed();

// ============================================
// UTILITIES
// ============================================
const fmt = (n) => '₹' + Number(n || 0).toFixed(0);
const today = () => new Date().toISOString().split('T')[0];
const uid = () => Math.random().toString(36).slice(2, 10);

// ============================================
// MAIN APP + ROUTER
// ============================================
function App() {
  const [route, setRoute] = useState(() => window.location.hash.replace('#', '') || '/');
  const [session, setSession] = useState(DB.getSession());

  useEffect(() => {
    const onHash = () => setRoute(window.location.hash.replace('#', '') || '/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (path) => { window.location.hash = path; setRoute(path); };
  const login = (shop) => { DB.setSession({ shopId: shop.id }); setSession({ shopId: shop.id }); };
  const logout = () => { DB.clearSession(); setSession(null); navigate('/'); };

  // Public routes
  if (route === '/' || route === '') return <Marketplace navigate={navigate} />;
  if (route.startsWith('/shop/')) {
    const shopId = route.split('/shop/')[1];
    return <ShopPage shopId={shopId} navigate={navigate} />;
  }
  if (route === '/login') return <Login navigate={navigate} onLogin={login} />;
  if (route === '/register') return <Register navigate={navigate} onLogin={login} />;

  // Owner routes (protected)
  if (route.startsWith('/dashboard')) {
    if (!session) { navigate('/login'); return null; }
    const sub = route.replace('/dashboard', '').replace('/', '');
    if (sub === '' || sub === 'home') return <OwnerDashboard navigate={navigate} logout={logout} session={session} />;
    if (sub === 'products') return <OwnerProducts navigate={navigate} session={session} />;
    if (sub === 'orders') return <OwnerOrders navigate={navigate} session={session} />;
    if (sub === 'customers') return <OwnerCustomers navigate={navigate} session={session} />;
    if (sub === 'expenses') return <OwnerExpenses navigate={navigate} session={session} />;
    if (sub === 'analytics') return <OwnerAnalytics navigate={navigate} session={session} />;
  }

  return <div className="p-8">Page not found. <a href="#/" className="text-blue-600">Go home</a></div>;
}

// ============================================
// SHARED COMPONENTS
// ============================================
function Header({ navigate, session }) {
  return (
    <header className="bg-white border-b sticky top-0 z-40">
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="#/" className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-orange-400 to-pink-500 flex items-center justify-center text-white font-bold">S</div>
          <div>
            <div className="font-bold text-gray-900 leading-tight">SJS Goodness</div>
            <div className="text-xs text-gray-500">Puducherry Marketplace</div>
          </div>
        </a>
        <div className="flex items-center gap-3">
          <a href="#/" className="text-sm text-gray-600 hover:text-gray-900">Shops</a>
          {session ? (
            <a href="#/dashboard" className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg">My Dashboard</a>
          ) : (
            <a href="#/login" className="text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg">Owner Login</a>
          )}
        </div>
      </div>
    </header>
  );
}

function Sidebar({ current, navigate, logout }) {
  const items = [
    { key: 'home', label: 'Overview', icon: '📊' },
    { key: 'products', label: 'Products', icon: '📦' },
    { key: 'orders', label: 'Orders', icon: '🛒' },
    { key: 'customers', label: 'Customers', icon: '👥' },
    { key: 'expenses', label: 'Expenses', icon: '💰' },
    { key: 'analytics', label: 'Analytics', icon: '📈' },
  ];
  return (
    <aside className="w-56 bg-white border-r min-h-screen p-4 hidden md:block">
      <div className="space-y-1">
        {items.map(it => (
          <button key={it.key} onClick={() => navigate('/dashboard' + (it.key === 'home' ? '' : '/' + it.key))}
            className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-left ${current === it.key ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-700 hover:bg-gray-50'}`}>
            <span>{it.icon}</span> {it.label}
          </button>
        ))}
      </div>
      <div className="border-t mt-4 pt-4">
        <button onClick={logout} className="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg">🚪 Logout</button>
      </div>
    </aside>
  );
}

function StatusBadge({ status }) {
  const colors = {
    placed: 'bg-blue-100 text-blue-700',
    confirmed: 'bg-indigo-100 text-indigo-700',
    preparing: 'bg-yellow-100 text-yellow-700',
    out_for_delivery: 'bg-orange-100 text-orange-700',
    delivered: 'bg-green-100 text-green-700',
    cancelled: 'bg-red-100 text-red-700',
  };
  return <span className={`text-xs px-2 py-1 rounded-full ${colors[status] || 'bg-gray-100 text-gray-700'}`}>{status.replace(/_/g, ' ')}</span>;
}

function PayBadge({ status }) {
  const colors = {
    unpaid: 'bg-red-100 text-red-700',
    partially_paid: 'bg-yellow-100 text-yellow-700',
    paid: 'bg-green-100 text-green-700',
    refunded: 'bg-gray-100 text-gray-700',
  };
  return <span className={`text-xs px-2 py-1 rounded-full ${colors[status] || 'bg-gray-100'}`}>{status.replace(/_/g, ' ')}</span>;
}

// ============================================
// MARKETPLACE (PUBLIC)
// ============================================
function Marketplace({ navigate }) {
  const [shops] = useState(() => DB.getShops().filter(s => s.isApproved));
  const [products] = useState(() => DB.getProducts().filter(p => p.isPublished && p.isAvailable));
  const [search, setSearch] = useState('');

  const filteredShops = shops.filter(s =>
    !search || s.name.toLowerCase().includes(search.toLowerCase()) ||
    (s.category || '').toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="min-h-screen">
      <Header navigate={navigate} />
      <div className="bg-gradient-to-br from-orange-50 to-pink-50 py-12">
        <div className="max-w-4xl mx-auto px-4 text-center">
          <h1 className="text-3xl md:text-4xl font-bold text-gray-900">Discover Local Shops in Puducherry</h1>
          <p className="text-gray-600 mt-3">Buy directly from local sellers. Fresh products, honest prices.</p>
          <div className="mt-6 max-w-lg mx-auto">
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Search shops or categories..."
              className="w-full px-5 py-3 rounded-xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
            />
          </div>
        </div>
      </div>

      <main className="max-w-6xl mx-auto px-4 py-10">
        <h2 className="text-xl font-bold text-gray-900 mb-4">Shops ({filteredShops.length})</h2>
        {filteredShops.length === 0 ? (
          <div className="bg-white rounded-xl p-10 text-center text-gray-500">No shops found.</div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {filteredShops.map(shop => {
              const shopProducts = products.filter(p => p.shopId === shop.id);
              return (
                <a key={shop.id} href={`#/shop/${shop.id}`} className="bg-white rounded-2xl border overflow-hidden hover:shadow-lg transition fade-in">
                  <div className="h-32 bg-gradient-to-br from-orange-100 to-pink-100 flex items-center justify-center">
                    {shop.logo ? <img src={shop.logo} className="w-20 h-20 rounded-full object-cover border-4 border-white shadow" /> :
                      <div className="w-20 h-20 rounded-full bg-white flex items-center justify-center text-2xl font-bold text-orange-500">{shop.name[0]}</div>}
                  </div>
                  <div className="p-5">
                    <h3 className="font-bold text-gray-900">{shop.name}</h3>
                    <p className="text-xs text-gray-500 mt-1">{shop.category} · {shop.serviceArea}</p>
                    <p className="text-sm text-gray-600 mt-2 line-clamp-2">{shop.description}</p>
                    <p className="text-xs text-orange-600 font-medium mt-3">{shopProducts.length} products available →</p>
                  </div>
                </a>
              );
            })}
          </div>
        )}
      </main>
    </div>
  );
}

// ============================================
// SHOP PAGE (PUBLIC)
// ============================================
function ShopPage({ shopId, navigate }) {
  const [shop] = useState(() => DB.getShops().find(s => s.id === shopId));
  const [products, setProducts] = useState(() => DB.getProducts().filter(p => p.shopId === shopId && p.isPublished && p.isAvailable));
  const [cart, setCart] = useState({});
  const [showCheckout, setShowCheckout] = useState(false);
  const [form, setForm] = useState({ name: '', phone: '', address: '', notes: '' });
  const [orderPlaced, setOrderPlaced] = useState(null);

  if (!shop) return <div className="p-8">Shop not found. <a href="#/" className="text-blue-600">Back</a></div>;

  const addToCart = (p) => setCart({ ...cart, [p.id]: (cart[p.id] || 0) + 1 });
  const removeFromCart = (p) => {
    const c = { ...cart };
    if (!c[p.id]) return;
    c[p.id]--;
    if (c[p.id] <= 0) delete c[p.id];
    setCart(c);
  };

  const cartItems = Object.entries(cart).map(([pid, qty]) => {
    const p = products.find(x => x.id === pid);
    return p ? { product: p, qty, total: p.price * qty } : null;
  }).filter(Boolean);

  const cartTotal = cartItems.reduce((s, i) => s + i.total, 0);

  function placeOrder() {
    if (!form.name || !form.phone) return alert('Please enter your name and phone');
    if (cartItems.length === 0) return alert('Cart is empty');

    const orderNumber = 'SJS' + Date.now().toString().slice(-6);
    const order = {
      id: uid(),
      orderNumber,
      shopId: shop.id,
      customerName: form.name,
      customerPhone: form.phone,
      deliveryAddress: form.address,
      notes: form.notes,
      items: cartItems.map(i => ({
        productId: i.product.id,
        name: i.product.name,
        qty: i.qty,
        price: i.product.price,
        cost: i.product.cost,
        total: i.total
      })),
      subtotal: cartTotal,
      total: cartTotal,
      amountPaid: 0,
      paymentStatus: 'unpaid',
      orderStatus: 'placed',
      createdAt: new Date().toISOString()
    };

    const orders = DB.getOrders();
    orders.push(order);
    DB.saveOrders(orders);

    // Deduct stock
    const allProducts = DB.getProducts();
    cartItems.forEach(i => {
      const p = allProducts.find(x => x.id === i.product.id);
      if (p) p.stock = Math.max(0, p.stock - i.qty);
    });
    DB.saveProducts(allProducts);

    // Save customer record
    const customers = DB.getCustomers();
    let existing = customers.find(c => c.shopId === shop.id && c.phone === form.phone);
    if (existing) {
      existing.totalSpent = (existing.totalSpent || 0) + cartTotal;
      existing.orderCount = (existing.orderCount || 0) + 1;
      existing.lastOrderAt = new Date().toISOString();
    } else {
      customers.push({
        id: uid(), shopId: shop.id, name: form.name, phone: form.phone,
        address: form.address, totalSpent: cartTotal, orderCount: 1,
        lastOrderAt: new Date().toISOString(), notes: ''
      });
    }
    DB.saveCustomers(customers);

    setOrderPlaced({ orderNumber, total: cartTotal });
    setCart({});
    setShowCheckout(false);
  }

  if (orderPlaced) {
    return (
      <div className="min-h-screen">
        <Header navigate={navigate} />
        <div className="max-w-md mx-auto p-8 mt-10 bg-white rounded-2xl shadow text-center">
          <div className="text-5xl mb-4">✅</div>
          <h1 className="text-2xl font-bold text-gray-900">Order Placed!</h1>
          <p className="text-gray-600 mt-2">Order #{orderPlaced.orderNumber}</p>
          <p className="text-gray-800 font-semibold text-lg mt-1">{fmt(orderPlaced.total)}</p>
          <p className="text-sm text-gray-500 mt-4">{shop.name} will contact you shortly to confirm.</p>
          <a href="#/" className="inline-block mt-6 bg-blue-600 text-white px-5 py-2 rounded-lg">Back to Shops</a>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen">
      <Header navigate={navigate} />
      <div className="bg-white border-b">
        <div className="max-w-6xl mx-auto px-4 py-6 flex items-center gap-4">
          {shop.logo && <img src={shop.logo} className="w-16 h-16 rounded-full object-cover border" />}
          <div>
            <h1 className="text-2xl font-bold text-gray-900">{shop.name}</h1>
            <p className="text-sm text-gray-500">{shop.category} · {shop.serviceArea} · {shop.phone}</p>
            <p className="text-sm text-gray-600 mt-1">{shop.description}</p>
          </div>
        </div>
      </div>

      <main className="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div className="md:col-span-2">
          <h2 className="font-bold text-gray-900 mb-4">Products ({products.length})</h2>
          {products.length === 0 ? <div className="bg-white rounded-xl p-8 text-center text-gray-500">No products available.</div> :
            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
              {products.map(p => (
                <div key={p.id} className="bg-white rounded-xl border overflow-hidden">
                  <img src={p.image} className="w-full h-28 object-cover" onError={e => e.target.style.background = '#eee'} />
                  <div className="p-3">
                    <h3 className="font-medium text-sm text-gray-900">{p.name}</h3>
                    <p className="text-xs text-gray-500">{p.stock} {p.unit} in stock</p>
                    <div className="flex items-center justify-between mt-2">
                      <span className="font-bold text-gray-900">{fmt(p.price)}</span>
                      <button onClick={() => addToCart(p)} className="bg-blue-600 text-white text-xs px-3 py-1 rounded-lg hover:bg-blue-700">Add</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          }
        </div>

        <div className="bg-white rounded-xl border p-5 h-fit sticky top-20">
          <h2 className="font-bold text-gray-900 mb-3">Your Cart</h2>
          {cartItems.length === 0 ? <p className="text-sm text-gray-500">Cart is empty</p> :
            <div className="space-y-3">
              {cartItems.map(i => (
                <div key={i.product.id} className="flex items-center justify-between text-sm">
                  <div>
                    <p className="font-medium">{i.product.name}</p>
                    <p className="text-xs text-gray-500">{i.qty} × {fmt(i.product.price)}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => removeFromCart(i.product)} className="w-6 h-6 rounded bg-gray-100">−</button>
                    <button onClick={() => addToCart(i.product)} className="w-6 h-6 rounded bg-gray-100">+</button>
                  </div>
                </div>
              ))}
              <div className="border-t pt-3 flex justify-between font-bold">
                <span>Total</span><span>{fmt(cartTotal)}</span>
              </div>
              <button onClick={() => setShowCheckout(true)} className="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">Checkout</button>
            </div>
          }
        </div>
      </main>

      {showCheckout && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full fade-in">
            <h2 className="font-bold text-lg mb-4">Delivery Details</h2>
            <div className="space-y-3">
              <input placeholder="Your Name *" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              <input placeholder="Phone *" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} className="w-full px-3 py-2 border rounded-lg" />
              <textarea placeholder="Delivery Address" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} className="w-full px-3 py-2 border rounded-lg" rows={3}></textarea>
              <textarea placeholder="Notes (optional)" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} className="w-full px-3 py-2 border rounded-lg" rows={2}></textarea>
              <div className="bg-gray-50 p-3 rounded-lg flex justify-between font-bold">
                <span>Total</span><span>{fmt(cartTotal)}</span>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setShowCheckout(false)} className="flex-1 border py-2 rounded-lg">Cancel</button>
                <button onClick={placeOrder} className="flex-1 bg-green-600 text-white py-2 rounded-lg">Place Order</button>
              </div>
              <p className="text-xs text-gray-500 text-center">Payment on delivery. The shop will contact you.</p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================
// LOGIN
// ============================================
function Login({ navigate, onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  function submit(e) {
    e.preventDefault();
    const shop = DB.getShops().find(s => s.ownerEmail === email.trim().toLowerCase() && s.ownerPassword === password);
    if (!shop) return setError('Invalid email or password');
    onLogin(shop);
    navigate('/dashboard');
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
      <form onSubmit={submit} className="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-2xl font-bold text-gray-900">Owner Login</h1>
        <p className="text-gray-500 text-sm mb-6">Sign in to your private business dashboard</p>

        {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg mb-4 text-sm">{error}</div>}

        <div className="space-y-4">
          <input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-2 border rounded-lg" required />
          <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg" required />
          <button className="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700">Sign In</button>
        </div>

        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mt-6 text-xs text-blue-800">
          <strong>Demo account:</strong><br />
          Email: <code>mom@sjs.com</code><br />
          Password: <code>sjs12345</code>
        </div>

        <p className="text-center text-sm text-gray-500 mt-6">
          New shop? <a href="#/register" className="text-blue-600 hover:underline">Register</a>
        </p>
      </form>
    </div>
  );
}

// ============================================
// REGISTER
// ============================================
function Register({ navigate, onLogin }) {
  const [f, setF] = useState({ name: '', description: '', category: '', phone: '', email: '', password: '' });
  const [error, setError] = useState('');

  function submit(e) {
    e.preventDefault();
    if (DB.getShops().some(s => s.ownerEmail === f.email.toLowerCase())) return setError('Email already registered');
    const shop = {
      id: 'shop_' + uid(),
      ownerEmail: f.email.toLowerCase(),
      ownerPassword: f.password,
      name: f.name,
      description: f.description,
      category: f.category,
      serviceArea: 'Puducherry',
      phone: f.phone,
      logo: '',
      isApproved: true,
      createdAt: new Date().toISOString()
    };
    const shops = DB.getShops();
    shops.push(shop);
    DB.saveShops(shops);
    onLogin(shop);
    navigate('/dashboard');
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
      <form onSubmit={submit} className="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <h1 className="text-2xl font-bold text-gray-900">Register Your Shop</h1>
        <p className="text-gray-500 text-sm mb-6">Join the Puducherry marketplace</p>
        {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg mb-4 text-sm">{error}</div>}
        <div className="space-y-3">
          <input placeholder="Shop Name" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} className="w-full px-4 py-2 border rounded-lg" required />
          <input placeholder="Category (e.g. Groceries)" value={f.category} onChange={e => setF({ ...f, category: e.target.value })} className="w-full px-4 py-2 border rounded-lg" />
          <textarea placeholder="Short description" value={f.description} onChange={e => setF({ ...f, description: e.target.value })} className="w-full px-4 py-2 border rounded-lg" rows={2}></textarea>
          <input placeholder="Phone" value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} className="w-full px-4 py-2 border rounded-lg" required />
          <input type="email" placeholder="Email" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} className="w-full px-4 py-2 border rounded-lg" required />
          <input type="password" placeholder="Password (min 6)" value={f.password} onChange={e => setF({ ...f, password: e.target.value })} minLength={6} className="w-full px-4 py-2 border rounded-lg" required />
          <button className="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700">Create Account</button>
        </div>
        <p className="text-center text-sm text-gray-500 mt-6">
          Already have an account? <a href="#/login" className="text-blue-600 hover:underline">Sign in</a>
        </p>
      </form>
    </div>
  );
}

function useShopData(session) {
  const [shop] = useState(() => DB.getShops().find(s => s.id === session.shopId));
  const [products, setProducts] = useState(() => DB.getProducts().filter(p => p.shopId === session.shopId));
  const [orders, setOrders] = useState(() => DB.getOrders().filter(o => o.shopId === session.shopId));
  const [expenses, setExpenses] = useState(() => DB.getExpenses().filter(e => e.shopId === session.shopId));
  const [customers, setCustomers] = useState(() => DB.getCustomers().filter(c => c.shopId === session.shopId));

  const reload = () => {
    setProducts(DB.getProducts().filter(p => p.shopId === session.shopId));
    setOrders(DB.getOrders().filter(o => o.shopId === session.shopId));
    setExpenses(DB.getExpenses().filter(e => e.shopId === session.shopId));
    setCustomers(DB.getCustomers().filter(c => c.shopId === session.shopId));
  };
  return { shop, products, orders, expenses, customers, reload };
}
