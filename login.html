<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/head-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Login — SJS Goodness</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="form-container">
  <h1 class="form-title">Owner Login</h1>
  <p class="form-subtitle">Sign in to your private business dashboard.</p>

  <div class="form-warning">
    <strong>📞 First time?</strong><br>
    Contact <strong>8056669214</strong> on WhatsApp to get your shop approved.
  </div>

  <div id="error" class="form-error" style="display:none;"></div>

  <form id="login-form">
    <div class="form-group"><label>Email</label><input type="email" id="email" class="form-input" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" class="form-input" required></div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>

  <div class="form-info">
    <strong>Flaren admin login:</strong><br>
    Email: <code>flaren@sjs.com</code><br>
    Password: <code>flaren123</code>
  </div>

  <p class="form-footer">New shop? <a href="register.html">Register here</a></p>
  <p class="form-footer"><a href="index.html" style="color:#999;">← Back to marketplace</a></p>
</div>

<script src="js/tail-loader.js"></script>
<script>
window.addEventListener('sjs:ready', function () {
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('error');
    const submitBtn = e.target.querySelector('button[type="submit"]');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const result = await Auth.login(email, password);

    if (result.error === 'pending') {
      errEl.innerHTML = '⏳ Your shop is <strong>pending admin approval</strong>.<br>Contact <strong>8056669214</strong>.';
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }
    if (result.error) {
      errEl.textContent = result.error;
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }
    window.location.href = 'dashboard.html';
  });
});
</script>
</body>
</html>
